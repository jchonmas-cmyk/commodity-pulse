name: Update market data

on:
  schedule:
    # Every 15 minutes, Monday to Friday (UTC). GitHub may delay a run by a few minutes.
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test notification to the phone (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect data
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          TEST_ALERT: ${{ github.event.inputs.test_alert }}
        run: |
          cat > update_data.py <<'PYEOF'
          #!/usr/bin/env python3
          """Commodity Pulse data collector.

          Collects public market data and writes data.json (standard library only).
          Sources: Yahoo Finance (prices, Stooq as backup), US Treasury and FRED (real
          yield, US crude stocks), CFTC (fund positioning in gold).

          If a source fails, the last good values are kept and flagged "stale".
          The script exits with an error only if nothing at all could be refreshed.
          It also sends free phone alerts through ntfy.sh when NTFY_TOPIC is set.
          """
          import csv
          import io
          import json
          import math
          import os
          import sys
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          REPO = os.environ.get("GITHUB_REPOSITORY", "jchonmas-cmyk/commodity-pulse")
          PREV_URL = "https://raw.githubusercontent.com/%s/data/data.json" % REPO
          SITE_URL = "https://%s.github.io/%s/" % tuple(REPO.split("/"))
          OUT = os.environ.get("OUT_FILE", "data.json")
          UA = {"User-Agent": "Mozilla/5.0 (compatible; commodity-pulse/1.0)"}
          KEEP = 260            # sessions kept per commodity in data.json (about one year)
          HIST = 1300           # sessions used for the signal test (about five years)
          BT_H = 5              # forward horizon of the signal test, in sessions
          MAX_AGE_DAYS = 6      # a last price older than this is flagged stale

          # id: (Yahoo symbol, Stooq symbol or None)
          COMMODITIES = {
              "brent": ("BZ=F", "cb.f"),
              "wti": ("CL=F", "cl.f"),
              "natgas": ("NG=F", "ng.f"),
              "gold": ("GC=F", "gc.f"),
              "silver": ("SI=F", "si.f"),
              "platinum": ("PL=F", "pl.f"),
              "copper": ("HG=F", "hg.f"),
              "alu": ("ALI=F", None),
              "wheat": ("ZW=F", "zw.f"),
              "corn": ("ZC=F", "zc.f"),
              "soy": ("ZS=F", "zs.f"),
              "coffee": ("KC=F", "kc.f"),
              "sugar": ("SB=F", "sb.f"),
              "cocoa": ("CC=F", "cc.f"),
          }
          CONTEXT_YAHOO = {"dxy": "DX-Y.NYB", "vix": "^VIX", "cny": "CNY=X"}

          NAMES_FR = {"brent": "Brent", "wti": "WTI", "natgas": "Gaz naturel", "gold": "Or",
                      "silver": "Argent", "platinum": "Platine", "copper": "Cuivre",
                      "alu": "Aluminium", "wheat": "Blé", "corn": "Maïs", "soy": "Soja",
                      "coffee": "Café", "sugar": "Sucre", "cocoa": "Cacao"}
          LABEL_FR = {"up": "Haussier", "flat": "Neutre", "down": "Baissier"}
          BIG_MOVE = {"natgas": 7.0, "cocoa": 7.0, "coffee": 5.0, "sugar": 5.0}   # default 4.0 %


          def log(msg):
              print(msg, flush=True)


          def http_get(url, timeout=15, tries=2, headers=None, data=None):
              last = None
              for k in range(tries):
                  try:
                      h = dict(UA)
                      h.update(headers or {})
                      req = urllib.request.Request(url, headers=h, data=data)
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return r.read()
                  except Exception as e:  # network, HTTP error, timeout
                      last = e
                      time.sleep(1.0 * (k + 1))
              raise last


          # ---------------------------------------------------------------- prices
          def yahoo_series(symbol, rng="1y"):
              url = ("https://query1.finance.yahoo.com/v8/finance/chart/%s?range=%s&interval=1d"
                     % (urllib.parse.quote(symbol), rng))
              res = json.loads(http_get(url))["chart"]["result"][0]
              offset = res.get("meta", {}).get("gmtoffset", 0) or 0
              closes = res["indicators"]["quote"][0]["close"]
              dates, vals = [], []
              for ts, c in zip(res["timestamp"], closes):
                  if c is None or c <= 0:
                      continue
                  day = datetime.fromtimestamp(ts + offset, tz=timezone.utc).strftime("%Y-%m-%d")
                  if dates and dates[-1] == day:      # keep the latest bar of a day
                      vals[-1] = round(c, 4)
                  else:
                      dates.append(day)
                      vals.append(round(c, 4))
              return dates[-HIST:], vals[-HIST:]


          def stooq_series(symbol):
              url = "https://stooq.com/q/d/l/?s=%s&i=d" % urllib.parse.quote(symbol)
              text = http_get(url).decode("utf-8", "replace")
              rows = list(csv.DictReader(io.StringIO(text)))
              dates, vals = [], []
              for r in rows:
                  try:
                      dates.append(r["Date"])
                      vals.append(round(float(r["Close"]), 4))
                  except (KeyError, ValueError):
                      continue
              if not dates:
                  raise ValueError("stooq returned no rows")
              return dates[-HIST:], vals[-HIST:]


          def fetch_commodity(cid, yahoo_sym, stooq_sym):
              errors = []
              for name, fn, sym in (("yahoo", lambda x: yahoo_series(x, "5y"), yahoo_sym), ("stooq", stooq_series, stooq_sym)):
                  if not sym:
                      continue
                  try:
                      d, c = fn(sym)
                      if len(d) >= 30:
                          return {"d": d, "c": c, "src": name, "stale": False}
                      errors.append("%s: only %d rows" % (name, len(d)))
                  except Exception as e:
                      errors.append("%s: %s" % (name, e))
              raise RuntimeError("; ".join(errors))


          # --------------------------------------------------------------- context
          def fred_series(series_id, days=150):
              since = (datetime.now(timezone.utc) - timedelta(days=days)).strftime("%Y-%m-%d")
              url = "https://fred.stlouisfed.org/graph/fredgraph.csv?id=%s&cosd=%s" % (series_id, since)
              text = http_get(url, timeout=20, tries=2).decode("utf-8", "replace")
              rows = list(csv.reader(io.StringIO(text)))[1:]
              out = []
              for r in rows:
                  if len(r) < 2 or r[1] in ("", "."):
                      continue
                  try:
                      out.append((r[0], float(r[1])))
                  except ValueError:
                      continue
              if len(out) < 2:
                  raise ValueError("FRED %s returned too few values" % series_id)
              return out


          def treasury_real_yield():
              """10-year real yield from the US Treasury (daily, no key)."""
              year = datetime.now(timezone.utc).year
              rows = []
              for y in (year, year - 1):
                  url = ("https://home.treasury.gov/resource-center/data-chart-center/interest-rates/"
                         "daily-treasury-rates.csv/%d/all?type=daily_treasury_real_yield_curve"
                         "&field_tdr_date_value=%d&page&_format=csv" % (y, y))
                  text = http_get(url, timeout=20, tries=2).decode("utf-8-sig", "replace")
                  for r in csv.DictReader(io.StringIO(text)):
                      key = next((k for k in r if k and "10" in k), None)
                      if not key or not r.get("Date") or not r[key]:
                          continue
                      try:
                          d = datetime.strptime(r["Date"], "%m/%d/%Y").strftime("%Y-%m-%d")
                          rows.append((d, float(r[key])))
                      except ValueError:
                          continue
                  if len(rows) >= 2:
                      break
              rows.sort()
              if len(rows) < 2:
                  raise ValueError("Treasury returned too few values")
              return rows


          def ctx_yahoo(symbol):
              d, c = yahoo_series(symbol)
              return {"v": round(c[-1], 4), "chg": round((c[-1] / c[-2] - 1) * 100, 2), "d": d[-1]}


          def ctx_real_yield():
              errors = []
              for fn in (treasury_real_yield, lambda: fred_series("DFII10")):
                  try:
                      s = fn()
                      return {"v": round(s[-1][1], 2), "chg": round(s[-1][1] - s[-2][1], 2), "d": s[-1][0]}
                  except Exception as e:
                      errors.append(str(e))
              raise RuntimeError("; ".join(errors))


          def eia_api_stocks(key):
              url = ("https://api.eia.gov/v2/petroleum/stoc/wstk/data/?api_key=%s&frequency=weekly"
                     "&data[0]=value&facets[series][]=WCESTUS1&sort[0][column]=period"
                     "&sort[0][direction]=desc&length=2" % urllib.parse.quote(key))
              rows = json.loads(http_get(url, timeout=20, tries=2))["response"]["data"]
              if len(rows) < 2:
                  raise ValueError("EIA returned too few values")
              return [(rows[1]["period"], float(rows[1]["value"])), (rows[0]["period"], float(rows[0]["value"]))]


          def eia_wpsr_stocks():
              """US commercial crude stocks (million barrels) from the EIA weekly report table, no key."""
              text = http_get("https://ir.eia.gov/wpsr/table1.csv", timeout=20, tries=2).decode("utf-8-sig", "replace")
              rows = list(csv.reader(io.StringIO(text)))
              head = rows[0]
              for r in rows[1:]:
                  if len(r) >= 3 and r[0].strip().startswith("Commercial (Excluding SPR)"):
                      now_v = float(r[1].replace(",", ""))
                      prev_v = float(r[2].replace(",", ""))
                      d = datetime.strptime(head[1].strip(), "%m/%d/%y").strftime("%Y-%m-%d")
                      return {"v": round(now_v, 1), "chg": round(now_v - prev_v, 1), "d": d}
              raise ValueError("EIA table has no commercial crude row")


          def ctx_crude_stocks():
              """US crude stocks in million barrels, weekly."""
              errors = []
              try:
                  return eia_wpsr_stocks()
              except Exception as e:
                  errors.append("eia csv: %s" % e)
              series = None
              key = os.environ.get("EIA_API_KEY", "").strip()
              sources = ([lambda: eia_api_stocks(key)] if key else []) + [lambda: fred_series("WCESTUS1", 90)]
              for fn in sources:
                  try:
                      series = fn()
                      break
                  except Exception as e:
                      errors.append(str(e))
              if not series:
                  raise RuntimeError("; ".join(errors))
              return {"v": round(series[-1][1] / 1000, 1),
                      "chg": round((series[-1][1] - series[-2][1]) / 1000, 1), "d": series[-1][0]}


          def ctx_cot_gold():
              where = "market_and_exchange_names like 'GOLD - COMMODITY EXCHANGE INC.%'"
              q = urllib.parse.urlencode({
                  "$where": where,
                  "$order": "report_date_as_yyyy_mm_dd DESC",
                  "$limit": "156",
                  "$select": "report_date_as_yyyy_mm_dd,noncomm_positions_long_all,noncomm_positions_short_all",
              }, quote_via=urllib.parse.quote)
              rows = json.loads(http_get("https://publicreporting.cftc.gov/resource/6dca-aqww.json?" + q))
              nets = [int(float(r["noncomm_positions_long_all"])) - int(float(r["noncomm_positions_short_all"]))
                      for r in rows]
              if len(nets) < 20:
                  raise ValueError("CFTC returned too few weeks")
              pct = 100.0 * sum(1 for n in nets if n <= nets[0]) / len(nets)
              return {"v": round(pct), "chg": None, "d": rows[0]["report_date_as_yyyy_mm_dd"][:10], "net": nets[0]}


          # --------------------------------------------------------------- signals
          def compute_signal(c):
              """Same three measures as the page: trend, momentum (RSI) and speed."""
              if len(c) < 30:
                  return None
              px = c[-1]
              ma = sum(c[-20:]) / 20
              gap = (px / ma - 1) * 100
              g = l = 0.0
              for i in range(1, 15):
                  d = c[i] - c[i - 1]
                  if d >= 0:
                      g += d
                  else:
                      l -= d
              g /= 14
              l /= 14
              for i in range(15, len(c)):
                  d = c[i] - c[i - 1]
                  g = (g * 13 + max(d, 0)) / 14
                  l = (l * 13 + max(-d, 0)) / 14
              rsi = 100.0 if l == 0 else 100 - 100 / (1 + g / l)
              rets = [math.log(c[i] / c[i - 1]) for i in range(len(c) - 20, len(c))]
              m = sum(rets) / len(rets)
              sd = math.sqrt(sum((r - m) ** 2 for r in rets) / (len(rets) - 1))
              c5 = (px / c[-6] - 1) * 100
              z = c5 / 100 / (sd * math.sqrt(5)) if sd else 0
              trend = 1 if gap > 0.5 else -1 if gap < -0.5 else 0
              mom = 1 if rsi > 55 else -1 if rsi < 45 else 0
              spd = 1 if z > 1 else -1 if z < -1 else 0
              score = trend + mom + spd
              label = "up" if score >= 2 else "down" if score <= -2 else "flat"
              return {"score": score, "label": label, "rsi": round(rsi, 1), "gap": round(gap, 2)}



          def signal_labels(c):
              """Signal label for every session i >= 30, using only data up to i (same rules as the page)."""
              n = len(c)
              out = [None] * n
              if n < 32:
                  return out
              g = l = 0.0
              for i in range(1, 15):
                  d = c[i] - c[i - 1]
                  if d >= 0:
                      g += d
                  else:
                      l -= d
              g /= 14
              l /= 14
              rsis = [None] * n
              rsis[14] = 100.0 if l == 0 else 100 - 100 / (1 + g / l)
              for i in range(15, n):
                  d = c[i] - c[i - 1]
                  g = (g * 13 + max(d, 0)) / 14
                  l = (l * 13 + max(-d, 0)) / 14
                  rsis[i] = 100.0 if l == 0 else 100 - 100 / (1 + g / l)
              lr = [0.0] + [math.log(c[i] / c[i - 1]) for i in range(1, n)]
              for i in range(30, n):
                  ma = sum(c[i - 19:i + 1]) / 20
                  gap = (c[i] / ma - 1) * 100
                  win = lr[i - 19:i + 1]
                  m = sum(win) / 20
                  sd = math.sqrt(sum((r - m) ** 2 for r in win) / 19)
                  c5 = (c[i] / c[i - 5] - 1) * 100
                  z = c5 / 100 / (sd * math.sqrt(5)) if sd else 0
                  trend = 1 if gap > 0.5 else -1 if gap < -0.5 else 0
                  mom = 1 if rsis[i] > 55 else -1 if rsis[i] < 45 else 0
                  spd = 1 if z > 1 else -1 if z < -1 else 0
                  score = trend + mom + spd
                  out[i] = "up" if score >= 2 else "down" if score <= -2 else "flat"
              return out


          def backtest_stats(c):
              """Replay the signal: what happened over the next BT_H sessions? [count, sum of % moves, hits]."""
              labs = signal_labels(c)
              st = {"up": [0, 0.0, 0], "flat": [0, 0.0, 0], "down": [0, 0.0, 0], "all": [0, 0.0]}
              for i in range(30, len(c) - BT_H):
                  lab = labs[i]
                  if lab is None:
                      continue
                  f = (c[i + BT_H] / c[i] - 1) * 100
                  hit = (lab == "up" and f > 0) or (lab == "down" and f < 0)
                  st[lab][0] += 1
                  st[lab][1] += f
                  st[lab][2] += 1 if hit else 0
                  st["all"][0] += 1
                  st["all"][1] += f
              for k in st:
                  st[k][1] = round(st[k][1], 3)
              return st


          # ---------------------------------------------------------------- health
          def run_health(items, problems, alerts, today):
              """One alert per day if prices could not be refreshed for several commodities."""
              topic = os.environ.get("NTFY_TOPIC", "").strip()
              bad = [k for k, it in items.items() if it.get("stale")]
              fails = [p for p in problems if not p.startswith("ctx")]
              if not topic or (len(bad) < 3 and len(fails) < 3) or alerts.get("health") == today:
                  return alerts
              try:
                  ntfy_send(topic, "Commodity Pulse : collecte en difficulté",
                            "%d matières n’ont pas pu être mises à jour. Vérifiez l’onglet Actions du dépôt." % max(len(bad), len(fails)),
                            ["rotating_light"])
                  alerts["health"] = today
                  log("alerts: health alert sent")
              except Exception as e:
                  log("alerts: health alert failed: %s" % e)
              return alerts

          # ---------------------------------------------------------------- alerts
          def ntfy_send(topic, title, message, tags):
              body = json.dumps({"topic": topic, "title": title, "message": message,
                                 "tags": tags, "click": SITE_URL}).encode("utf-8")
              http_get("https://ntfy.sh/", timeout=15, tries=2,
                       headers={"Content-Type": "application/json"}, data=body)


          def fmt(x):
              return ("%.2f" % x).replace(".", ",")


          def run_alerts(items, signals, prev, today):
              """At most one signal alert and one big-move alert per commodity per day."""
              topic = os.environ.get("NTFY_TOPIC", "").strip()
              old_state = prev.get("alerts", {})
              state = {"signal": dict(old_state.get("signal", {})), "move": dict(old_state.get("move", {})),
                       "health": old_state.get("health")}
              if not topic:
                  log("alerts: NTFY_TOPIC not set, skipped")
                  return state
              if os.environ.get("TEST_ALERT", "").lower() == "true":
                  try:
                      ntfy_send(topic, "Commodity Pulse", "Test réussi : les alertes fonctionnent.", ["white_check_mark"])
                      log("alerts: test message sent")
                  except Exception as e:
                      log("alerts: test failed: %s" % e)
              prev_sig = prev.get("signals", {})
              for cid, it in items.items():
                  sig = signals.get(cid)
                  if not sig or it.get("stale") or len(it["c"]) < 2:
                      continue
                  name = NAMES_FR.get(cid, cid)
                  px = it["c"][-1]
                  chg1 = (px / it["c"][-2] - 1) * 100
                  old = prev_sig.get(cid, {}).get("label")
                  if old and old != sig["label"] and state["signal"].get(cid) != today:
                      tag = "chart_with_upwards_trend" if sig["label"] == "up" else \
                            "chart_with_downwards_trend" if sig["label"] == "down" else "left_right_arrow"
                      try:
                          ntfy_send(topic, "%s : %s" % (name, LABEL_FR[sig["label"]]),
                                    "%s passe de %s à %s. Prix %s (%s %% sur 1 jour)."
                                    % (name, LABEL_FR.get(old, old), LABEL_FR[sig["label"]], fmt(px), fmt(chg1)), [tag])
                          state["signal"][cid] = today
                          log("alerts: signal alert sent for %s" % cid)
                      except Exception as e:
                          log("alerts: failed for %s: %s" % (cid, e))
                  if abs(chg1) >= BIG_MOVE.get(cid, 4.0) and state["move"].get(cid) != today:
                      try:
                          ntfy_send(topic, "%s : forte variation" % name,
                                    "%s bouge de %s %% sur 1 jour (prix %s)." % (name, fmt(chg1), fmt(px)), ["warning"])
                          state["move"][cid] = today
                          log("alerts: move alert sent for %s" % cid)
                      except Exception as e:
                          log("alerts: failed for %s: %s" % (cid, e))
              return state


          # ------------------------------------------------------------------ main
          def load_previous():
              path = os.environ.get("PREV_FILE")
              try:
                  raw = open(path, "rb").read() if path else http_get(PREV_URL, tries=1)
                  return json.loads(raw)
              except Exception:
                  return {}


          def main():
              t0 = time.time()
              prev = load_previous()
              prev_items, prev_ctx = prev.get("items", {}), prev.get("ctx", {})
              items, ctx, fresh, problems = {}, {}, 0, []
              prev_bt = prev.get("bt", {})
              bt_per, bt_span = {}, {}
              now = datetime.now(timezone.utc)
              today = now.strftime("%Y-%m-%d")

              for cid, (ysym, ssym) in COMMODITIES.items():
                  try:
                      it = fetch_commodity(cid, ysym, ssym)
                      age = (now.date() - datetime.strptime(it["d"][-1], "%Y-%m-%d").date()).days
                      it["stale"] = age > MAX_AGE_DAYS
                      try:
                          bt_per[cid] = backtest_stats(it["c"])
                          bt_span[cid] = (datetime.strptime(it["d"][-1], "%Y-%m-%d") - datetime.strptime(it["d"][0], "%Y-%m-%d")).days
                      except Exception as e:
                          log("bt    %-9s %s" % (cid, e))
                      it["d"], it["c"] = it["d"][-KEEP:], it["c"][-KEEP:]
                      items[cid] = it
                      fresh += 1
                      log("ok    %-9s %s  last %s = %s" % (cid, it["src"], it["d"][-1], it["c"][-1]))
                  except Exception as e:
                      problems.append("%s: %s" % (cid, e))
                      log("FAIL  %-9s %s" % (cid, e))
                      if cid in prev_items:
                          old = dict(prev_items[cid])
                          old["stale"] = True
                          items[cid] = old
                  time.sleep(0.2)
              for cid in COMMODITIES:
                  if cid not in bt_per and cid in prev_bt.get("per", {}):
                      bt_per[cid] = prev_bt["per"][cid]
                      bt_span[cid] = prev_bt.get("span", {}).get(cid, 0)

              jobs = [(k, (lambda s=s: ctx_yahoo(s))) for k, s in CONTEXT_YAHOO.items()]
              jobs += [("real", ctx_real_yield), ("eia", ctx_crude_stocks), ("cot", ctx_cot_gold)]
              for key, fn in jobs:
                  try:
                      ctx[key] = fn()
                      fresh += 1
                      log("ok    ctx:%-5s %s" % (key, ctx[key]))
                  except Exception as e:
                      problems.append("ctx %s: %s" % (key, e))
                      log("FAIL  ctx:%-5s %s" % (key, e))
                      if key in prev_ctx:
                          ctx[key] = prev_ctx[key]
                  time.sleep(0.2)

              if fresh == 0:
                  log("Nothing could be refreshed. data.json left untouched.")
                  return 1

              signals = {}
              for cid, it in items.items():
                  s = compute_signal(it["c"])
                  if s:
                      signals[cid] = s
              try:
                  alerts = run_alerts(items, signals, prev, today)
              except Exception as e:
                  log("alerts: unexpected error: %s" % e)
                  alerts = prev.get("alerts", {"signal": {}, "move": {}})

              alerts = run_health(items, problems, alerts, today)
              out = {
                  "updated": now.strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "items": items,
                  "ctx": ctx,
                  "signals": signals,
                  "alerts": alerts,
                  "bt": {"h": BT_H, "per": bt_per, "span": bt_span},
                  "problems": problems,
              }
              with open(OUT, "w", encoding="utf-8") as f:
                  json.dump(out, f, separators=(",", ":"))
              log("Wrote %s: %d commodities, %d context values, %d problems, %.0fs"
                  % (OUT, len(items), len(ctx), len(problems), time.time() - t0))
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          python3 update_data.py

      - name: Publish data.json on the data branch
        run: |
          mkdir out
          cp data.json out/data.json
          cd out
          git init -q -b data
          git config user.name "commodity-pulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -q -m "Update market data"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
