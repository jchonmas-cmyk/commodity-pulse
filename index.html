<title>Commodity Pulse</title>
<style>
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
/* Layout: one narrow column, mobile first. Hero summary, one filter row, grouped rows that expand into a chart, then context and glossary. */
:root{
  color-scheme:light;
  --bg:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834;
  --up:#2a78d6; --down:#e34948; --flat:#c3c2b7;
  --up-ink:#1c5cab; --down-ink:#d03b3b;
  --shadow:0 2px 10px rgba(11,11,11,.14);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926;
    --up:#3987e5; --down:#e66767; --flat:#4a4944;
    --up-ink:#6da7ec; --down-ink:#e66767;
    --shadow:0 2px 10px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926;
  --up:#3987e5; --down:#e66767; --flat:#4a4944;
  --up-ink:#6da7ec; --down-ink:#e66767;
  --shadow:0 2px 10px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px));
}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:6px}
h1{font-size:24px;line-height:1.2;margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0;font-weight:600}
p{margin:0}
.sub{color:var(--ink2);font-size:13px;margin-top:2px}

.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-start;justify-content:space-between}
.ctrls{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;color:var(--ink2);padding:6px 11px;border-radius:8px;font-size:13px;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.note{margin-top:14px;font-size:13px;color:var(--ink2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface)}
.note b{color:var(--ink)}

.hero{margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px}
.big{font-size:56px;font-weight:650;line-height:1;letter-spacing:-.02em}
.big small{font-size:28px;font-weight:500;color:var(--ink2);letter-spacing:0}
.hero .lead{margin-top:8px;font-size:16px;font-weight:550}
.hero .help{margin-top:4px;font-size:13px;color:var(--ink2)}
.segbar{display:flex;gap:2px;height:8px;margin-top:16px}
.segbar i{display:block;border-radius:999px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px}
.key{display:inline-block;width:14px;height:2px;border-radius:1px;vertical-align:middle}

.filters{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:space-between;margin-top:22px}
.fg{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:999px;padding:6px 12px;font-size:13px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}

.grp{margin-top:22px}
.grp>h2{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.grp>h2 span{font-weight:400;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.item+.item{border-top:1px solid var(--grid)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 76px auto;gap:2px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 14px}
.row:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.c1{display:flex;flex-direction:column;gap:5px;min-width:0}
.nm{font-weight:600;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}

try{var sv=JSON.parse(localStorage.getItem('commodity-pulse')||'{}');if(sv.lang&&T[sv.lang])state.lang=sv.lang;if(sv.mode==='beginner'||sv.mode==='trader')state.mode=sv.mode;if(sv.tab==='sim')state.tab='sim'}catch(e){}

function rangeK(c){var k=state.range==='1m'?22:state.range==='3m'?66:c.n-c.y0;return Math.max(10,Math.min(c.n,k))}

/* ---------- Formatting ---------- */
function nf(n,dec,signed){return new Intl.NumberFormat(LOC[state.lang],{minimumFractionDigits:dec,maximumFractionDigits:dec,signDisplay:signed?'always':'auto'}).format(n)}
function pct(n){return nf(n,2,true)+(state.lang==='fr'?' %':'%')}
function sgn(n){return n>0?'+'+n:n<0?'−'+Math.abs(n):'0'}
function cls(n){return n>0.005?'pos':n<-0.005?'neg':''}
function fd(d,o){o.timeZone='UTC';return new Intl.DateTimeFormat(LOC[state.lang],o).format(d)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---------- Building blocks ---------- */
function pillCls(cl,text){var ic=cl==='up'?'<path d="M5 1.5 9 8.5H1Z"/>':cl==='down'?'<path d="M5 8.5 1 1.5h8Z"/>':'<circle cx="5" cy="5" r="3.2"/>';return '<span class="pill '+cl+'"><svg viewBox="0 0 10 10" aria-hidden="true">'+ic+'</svg>'+esc(text)+'</span>'}
function pill(l){return pillCls(l,tr()[l])}
function termBtn(id,label){return '<button type="button" class="term" data-act="term" data-v="'+id+'">'+esc(label)+'</button>'}
function spark(vals,w,h){
 var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),p=5,n=vals.length;
 function X(i){return p+i*(w-2*p)/(n-1)}
 function Y(v){return p+(1-(v-mn)/((mx-mn)||1))*(h-2*p)}
 var d='';vals.forEach(function(v,i){d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)});
 var lx=X(n-1).toFixed(1),ly=Y(vals[n-1]).toFixed(1);
 return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true"><path class="sp-area" d="'+d+'L'+lx+' '+(h-p)+'L'+X(0).toFixed(1)+' '+(h-p)+'Z"/><path class="sp-line" d="'+d+'"/><circle class="sp-dot" cx="'+lx+'" cy="'+ly+'" r="4"/></svg>';
}
function sentence(a){var t=tr(),s=a.label==='up'?t.sUp:a.label==='down'?t.sDown:t.sFlat,j=state.lang==='zh'?'':' ';if(a.rsi>70)s+=j+t.hot;else if(a.rsi<30)s+=j+t.cold;return s}

function rowHtml(c){
 var t=tr(),a=c.a,open=!!state.open[c.id],K=rangeK(c);
 var sub=state.mode==='trader'?c.unit+' · '+c.tk:c.unit;

  ?'RSI '+Math.round(a.rsi)+' · MA20 '+pct(a.gap)+' · '+t.d5+' '+pct(a.c5)

 return '<div class="item"><button type="button" class="row" data-act="row" data-v="'+c.id+'" data-fk="row-'+c.id+'" aria-expanded="'+open+'" aria-controls="d-'+c.id+'">'

 var rows='';for(var k=0;k<8&&k<c.n;k++){var i=c.n-1-k;rows+='<tr><td>'+fd(c.dates[i],{day:'numeric',month:'short'})+'</td><td>'+nf(c.s[i],c.dec)+'</td><td>'+nf(sma(c.s,20,i),c.dec)+'</td></tr>'}

function calHtml(){

function niceTicks(lo,hi,n){var raw=(hi-lo)/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,step=(f<1.5?1:f<3?2:f<7?5:10)*p,out=[];for(var v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step)out.push(+v.toFixed(10));return{ticks:out,step:step}}
function drawCharts(){document.querySelectorAll('.chart[data-id]').forEach(drawChart)}
function drawChart(el){
 var t=tr(),c=DATA.filter(function(x){return x.id===el.dataset.id})[0],W=el.clientWidth;
 if(!c||W<120)return;
 var K=rangeK(c),n0=Math.max(19,c.n-K),idx=[],i;K=c.n-n0;for(i=n0;i<c.n;i++)idx.push(i);
 var px=idx.map(function(i){return c.s[i]}),ma=idx.map(function(i){return sma(c.s,20,i)});
 var H=200,m={l:48,r:10,t:10,b:24},all=px.concat(ma);
 var lo=Math.min.apply(null,all),hi=Math.max.apply(null,all),pad=(hi-lo)*.08||1;lo-=pad;hi+=pad;
 var nt=niceTicks(lo,hi,4),tdec=nt.step>=1?0:Math.min(3,Math.ceil(-Math.log10(nt.step)));
 function X(k){return m.l+k/(K-1)*(W-m.l-m.r)}
 function Y(v){return m.t+(1-(v-lo)/(hi-lo))*(H-m.t-m.b)}
 function path(a){return a.map(function(v,k){return(k?'L':'M')+X(k).toFixed(1)+' '+Y(v).toFixed(1)}).join('')}
 var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" tabindex="0" role="img" aria-label="'+esc(t.names[c.id]+' — '+t.price+', '+t.ma)+'">';
 nt.ticks.forEach(function(v){s+='<line class="gl" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text class="tk" x="'+(m.l-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+nf(v,tdec)+'</text>'});
 s+='<line class="ax" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+(H-m.b)+'" y2="'+(H-m.b)+'"/>';
 [[0,'start'],[Math.round((K-1)/2),'middle'],[K-1,'end']].forEach(function(p){s+='<text class="tk" x="'+X(p[0]).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+p[1]+'">'+fd(c.dates[idx[p[0]]],{day:'numeric',month:'short'})+'</text>'});
 s+='<path d="'+path(px)+'L'+X(K-1).toFixed(1)+' '+(H-m.b)+'L'+X(0).toFixed(1)+' '+(H-m.b)+'Z" fill="var(--s1)" opacity=".1"/>';
 s+='<path class="ln" stroke="var(--s2)" d="'+path(ma)+'"/><path class="ln" stroke="var(--s1)" d="'+path(px)+'"/>';
 s+='<circle cx="'+X(K-1).toFixed(1)+'" cy="'+Y(px[K-1]).toFixed(1)+'" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>';
 s+='<g class="hov" visibility="hidden"><line class="ax" y1="'+m.t+'" y2="'+(H-m.b)+'"/><circle class="h2" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/><circle class="h1" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/></g></svg><div class="tip" hidden></div>';
 el.innerHTML=s;
 var svg=el.querySelector('svg'),tip=el.querySelector('.tip'),hov=svg.querySelector('.hov'),cur=K-1;
 function show(k){
  k=Math.max(0,Math.min(K-1,k));cur=k;var x=X(k);
  var ln=hov.querySelector('line');ln.setAttribute('x1',x);ln.setAttribute('x2',x);
  var h1=hov.querySelector('.h1'),h2=hov.querySelector('.h2');
  h1.setAttribute('cx',x);h1.setAttribute('cy',Y(px[k]));h2.setAttribute('cx',x);h2.setAttribute('cy',Y(ma[k]));
  hov.setAttribute('visibility','visible');
  tip.hidden=false;
  tip.innerHTML='<div class="d">'+esc(fd(c.dates[idx[k]],{day:'numeric',month:'short',year:'numeric'}))+'</div>'
   +'<div class="r"><i class="key" style="background:var(--s1)"></i><b>'+nf(px[k],c.dec)+'</b><span class="n">'+esc(t.price)+'</span></div>'
   +'<div class="r"><i class="key" style="background:var(--s2)"></i><b>'+nf(ma[k],c.dec)+'</b><span class="n">'+esc(t.ma)+'</span></div>';
  var tw=tip.offsetWidth,left=x+12;if(left+tw>W-2)left=x-12-tw;tip.style.left=Math.max(2,left)+'px';
 }
 function hide(){hov.setAttribute('visibility','hidden');tip.hidden=true}
 function at(e){var r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*(W/r.width);show(Math.round((x-m.l)/(W-m.l-m.r)*(K-1)))}
 svg.addEventListener('pointermove',at);
 svg.addEventListener('pointerdown',at);
 svg.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')hide()});
 svg.addEventListener('focus',function(){show(cur)});
 svg.addEventListener('blur',hide);
 svg.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'){show(cur-1);e.preventDefault()}
  else if(e.key==='ArrowRight'){show(cur+1);e.preventDefault()}
  else if(e.key==='Home'){show(0);e.preventDefault()}
  else if(e.key==='End'){show(K-1);e.preventDefault()}
  else if(e.key==='Escape'){hide()}

}

function expectedLast(now){

function btFromServer(bt,items){

/* ---------- v4: risk-free simulator (fictional money, real delayed prices) ---------- */
var SIMK='commodity-pulse-sim',SIM0=10000,SIM_MIN=10,LVTH=[0,2,5,10,25];
function simFresh(){return{cash:SIM0,start:SIM0,pos:[],log:[]}}
function simLoad(){
 try{var j=JSON.parse(localStorage.getItem(SIMK)||'null');
  if(j&&typeof j.cash==='number'&&isFinite(j.cash)&&Array.isArray(j.pos)&&Array.isArray(j.log)){j.start=j.start>0?j.start:SIM0;return j}}catch(e){}
 return simFresh();
}
var sim=simLoad();
function simSave(){try{localStorage.setItem(SIMK,JSON.stringify(sim))}catch(e){}}
function itemById(id){for(var i=0;i<DATA.length;i++)if(DATA[i].id===id)return DATA[i];return null}
function simCur(p){var c=itemById(p.id);return c?c.a.px:p.px}
function posValue(p,cur){return Math.max(0,p.qty*p.px+(p.side==='short'?-1:1)*(cur-p.px)*p.qty)}
function simTotal(){var s=sim.cash;sim.pos.forEach(function(p){s+=posValue(p,simCur(p))});return s}
function usd(n,d){return new Intl.NumberFormat(LOC[state.lang],{style:'currency',currency:'USD',currencyDisplay:'narrowSymbol',minimumFractionDigits:d,maximumFractionDigits:d}).format(n)}
function usdS(n){return (n>=0?'+':'−')+usd(Math.abs(n),2)}
function simLevel(ret){var i=0;for(var k=1;k<LVTH.length;k++)if(ret>=LVTH[k])i=k;return i}
function badgesNow(){
 var o=sim.log.filter(function(l){return l.act==='open'}),c=sim.log.filter(function(l){return l.act==='close'}),ids={},out=[];
 o.forEach(function(l){ids[l.id]=1});
 if(o.length)out.push('first');
 if(c.some(function(l){return l.pl>0}))out.push('gain');
 if(Object.keys(ids).length>=3)out.push('diver');
 if(o.some(function(l){return l.side==='short'}))out.push('short');
 if(c.some(function(l){return l.pl<0}))out.push('cut');
 return out;
}
function tradable(c){return STATUS==='live'&&!!c&&!c.stale&&c.a.px>0}
function simAmt(v){
 var el=document.getElementById('sim-amt');if(!el)return;
 var x=v==='all'?Math.floor(sim.cash*100)/100:+v;
 el.value=String(x);state.simAmt=String(x);
}
function simDo(kind,v){
 var t=tr().sim,before=badgesNow(),msg;
 if(kind==='open'){
  var idEl=document.getElementById('sim-id'),amEl=document.getElementById('sim-amt');
  var id=idEl?idEl.value:state.simId,amt=parseFloat(String(amEl?amEl.value:state.simAmt).replace(',','.')),c=itemById(id);
  if(!tradable(c))msg=['bad',t.msg.noprice];
  else if(!(amt>=SIM_MIN))msg=['bad',t.msg.min];
  else if(amt>sim.cash+0.005)msg=['bad',t.msg.cash];
  else{
   amt=Math.round(amt*100)/100;
   sim.cash=Math.round((sim.cash-amt)*100)/100;
   sim.pos.push({id:id,side:v==='short'?'short':'long',qty:amt/c.a.px,px:c.a.px,stake:amt,t:Date.now()});
   sim.log.push({t:Date.now(),id:id,side:v==='short'?'short':'long',act:'open',amt:amt,px:c.a.px});
   msg=['ok',t.msg.ok.replace('{n}',tr().names[id]).replace('{a}',usd(amt,2))];
   state.simId=id;
  }
 }else{
  var p=sim.pos[+v];
  if(p){
   var cur=simCur(p),val=Math.round(posValue(p,cur)*100)/100,pl=Math.round((val-p.stake)*100)/100;
   sim.cash=Math.round((sim.cash+val)*100)/100;sim.pos.splice(+v,1);
   sim.log.push({t:Date.now(),id:p.id,side:p.side,act:'close',amt:val,px:cur,pl:pl});
   msg=['ok',t.msg.closed.replace('{r}',val<=0?t.liq:usdS(pl))];
  }
 }
 if(!msg)return;
 if(sim.log.length>200)sim.log=sim.log.slice(-200);
 var now=badgesNow();
 state.simNew=now.filter(function(b){return before.indexOf(b)<0});
 if(state.simNew.length)msg[1]+=' 🏅 '+t.badgeNew+' '+state.simNew.map(function(b){return t.bdList[b][1]}).join(', ');
 state.simMsg=msg;simSave();render();
}

 if(isStandalone()){box.hidden=true;return}
 if(deferredInstall){box.hidden=false;btn.hidden=false;hint.hidden=true}
 else if(ios){box.hidden=false;hint.hidden=false;btn.hidden=true}
 else box.hidden=true;
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;instUI()});
window.addEventListener('appinstalled',function(){deferredInstall=null;instUI()});
document.addEventListener('click',function(e){
 if(e.target.id==='sheet'){closeTerm();return}
 var b=e.target.closest('[data-act]');if(!b)return;
 var a=b.dataset.act,v=b.dataset.v;
 if(a==='term'){openTerm(v);return}
 if(a==='doc'){openDoc(v);return}
 if(a==='amt'){simAmt(v);return}
 if(a==='open'){simDo('open',v);return}
 if(a==='close-pos'){simDo('close',v);return}
 if(a==='reset'||a==='reset-no'){state.simReset=(a==='reset');render();return}
 if(a==='reset-yes'){sim=simFresh();simSave();state.simReset=false;state.simMsg=null;state.simNew=[];render();return}
 if(a==='close'){closeTerm();return}
 if(a==='install'){if(deferredInstall){var p=deferredInstall;deferredInstall=null;p.prompt();if(p.userChoice)p.userChoice.then(instUI,instUI)}return}
 if(a==='lang'){state.lang=v;save()}
 else if(a==='mode'){state.mode=v;save()}
 else if(a==='grp'){state.grp=v}
 else if(a==='range'){state.range=v}
 else if(a==='tab'){state.tab=v;state.simMsg=null;state.simReset=false;save();window.scrollTo(0,0)}
 else if(a==='row'){if(state.open[v])delete state.open[v];else state.open[v]=true}
 if(!document.getElementById('sheet').hidden)document.getElementById('sheet').hidden=true;
 render();
});
document.addEventListener('change',function(e){if(e.target&&e.target.id==='sim-id'){state.simId=e.target.value;render()}});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='sim-amt')state.simAmt=e.target.value});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!document.getElementById('sheet').hidden)closeTerm()});
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(drawCharts,120)});
function toItem(c,s){
 var o=Object.assign({},c);
 o.s=s.c;o.dates=s.d.map(function(x){return new Date(x+'T00:00:00Z')});o.n=s.c.length;
 var ly=o.dates[o.n-1].getUTCFullYear(),first=0;
 while(first<o.n&&o.dates[first].getUTCFullYear()<ly)first++;
 o.y0=Math.max(0,first-1);o.stale=!!s.stale;o.a=analyze(o.s,o.y0);
 return o;
}
function fetchLive(){
 return fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(j){
  if(STATUS==='live'&&LIVE&&LIVE.updated===j.updated)return false;
  var items=[];
  COMMS.forEach(function(c){var s=j.items&&j.items[c.id];if(s&&s.c&&s.d&&s.c.length>=30&&s.c.length===s.d.length)items.push(toItem(c,s))});
  if(!items.length)throw new Error('empty');
  BT=null;try{BT=j.bt?btFromServer(j.bt,items):null}catch(e){BT=null}
  if(!BT){try{BT=backtest(items)}catch(e){BT=null}}
  DATA=items;LIVE=j;STATUS='live';return true;
 });
}
function refresh(first){
 return fetchLive().catch(function(){if(first){DATA=demoData();STATUS='demo';return true}return false}).then(function(changed){if(changed)render()});
}
render();
refresh(true);
setInterval(function(){if(!document.hidden)refresh(false)},300000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh(false)});
})();
</script>
