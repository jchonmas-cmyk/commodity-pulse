<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Commodity Pulse</title>
<style>
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
/* Layout: one narrow column, mobile first. Hero summary, one filter row, grouped rows that expand into a chart, then context and glossary. */
:root{
  color-scheme:light;
  --bg:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834;
  --up:#2a78d6; --down:#e34948; --flat:#c3c2b7;
  --up-ink:#1c5cab; --down-ink:#d03b3b;
  --shadow:0 2px 10px rgba(11,11,11,.14);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926;
    --up:#3987e5; --down:#e66767; --flat:#4a4944;
    --up-ink:#6da7ec; --down-ink:#e66767;
    --shadow:0 2px 10px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926;
  --up:#3987e5; --down:#e66767; --flat:#4a4944;
  --up-ink:#6da7ec; --down-ink:#e66767;
  --shadow:0 2px 10px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px));
}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:6px}
h1{font-size:24px;line-height:1.2;margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0;font-weight:600}
p{margin:0}
.sub{color:var(--ink2);font-size:13px;margin-top:2px}

.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-start;justify-content:space-between}
.ctrls{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;color:var(--ink2);padding:6px 11px;border-radius:8px;font-size:13px;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.note{margin-top:14px;font-size:13px;color:var(--ink2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface)}
.note b{color:var(--ink)}

.hero{margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px}
.big{font-size:56px;font-weight:650;line-height:1;letter-spacing:-.02em}
.big small{font-size:28px;font-weight:500;color:var(--ink2);letter-spacing:0}
.hero .lead{margin-top:8px;font-size:16px;font-weight:550}
.hero .help{margin-top:4px;font-size:13px;color:var(--ink2)}
.segbar{display:flex;gap:2px;height:8px;margin-top:16px}
.segbar i{display:block;border-radius:999px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px}
.key{display:inline-block;width:14px;height:2px;border-radius:1px;vertical-align:middle}

.filters{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:space-between;margin-top:22px}
.fg{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:999px;padding:6px 12px;font-size:13px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}

.grp{margin-top:22px}
.grp>h2{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.grp>h2 span{font-weight:400;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.item+.item{border-top:1px solid var(--grid)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 76px auto;gap:2px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 14px}
.row:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.c1{display:flex;flex-direction:column;gap:5px;min-width:0}
.nm{font-weight:600;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.unit{font-weight:400;font-size:12px;color:var(--ink2)}
.nn{display:inline-flex;align-items:center;gap:6px}
.chev{width:12px;height:12px;stroke:var(--ink2);fill:none;stroke-width:2;flex:none;transition:transform .15s}
.row[aria-expanded="true"] .chev{transform:rotate(180deg)}
.c3{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-variant-numeric:tabular-nums}
.px{font-weight:650}
.chg{font-size:13px}
.txt{grid-column:1/-1;margin-top:6px;font-size:13px;color:var(--ink2)}
.pos{color:var(--up-ink)} .neg{color:var(--down-ink)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;width:fit-content;line-height:1.5}
.pill svg{width:9px;height:9px;fill:currentColor}
.pill.up{color:var(--up-ink);background:color-mix(in srgb,var(--up) 14%,transparent)}
.pill.down{color:var(--down-ink);background:color-mix(in srgb,var(--down) 14%,transparent)}
.pill.flat{color:var(--ink2);background:color-mix(in srgb,var(--flat) 40%,transparent)}
.spark{display:block}
.sp-line{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.sp-area{fill:var(--s1);opacity:.1}
.sp-dot{fill:var(--s1);stroke:var(--surface);stroke-width:2}

.detail{padding:2px 14px 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:10px 12px}
.st{display:flex;flex-direction:column}
.sl{font-size:12px;color:var(--ink2)}
.sv{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.bd{margin-top:12px;font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.bd b{color:var(--ink)}
.watch{margin-top:12px;font-size:13px;color:var(--ink2)}
.watch b{color:var(--ink)}
.chart{position:relative;margin-top:14px}
.chart svg{display:block;width:100%;touch-action:pan-y;user-select:none}
.chart svg:focus-visible{outline-offset:0}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.gl{stroke:var(--grid);stroke-width:1}
.ax{stroke:var(--axis);stroke-width:1}
.tk{fill:var(--muted);font-size:11px}
.tip{position:absolute;top:6px;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap}
.tip .d{color:var(--ink2);margin-bottom:2px}
.tip .r{display:flex;align-items:center;gap:7px}
.tip .r b{font-size:13px;font-variant-numeric:tabular-nums}
.tip .r span.n{color:var(--ink2)}
.lg{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:12px;color:var(--ink2)}
.lg span{display:inline-flex;align-items:center;gap:6px}
details.tb{margin-top:10px;font-size:13px}
details.tb summary{cursor:pointer;color:var(--ink2);min-height:32px;display:flex;align-items:center}
.tbw{overflow-x:auto;margin-top:4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--ink2);font-size:12px}

.ctxi{padding:13px 14px}
.ctxi+.ctxi{border-top:1px solid var(--grid)}
.ch{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.cn{font-weight:600;min-width:0}
.cv{font-variant-numeric:tabular-nums;text-align:right;font-weight:650;white-space:nowrap}
.cv small{font-weight:400;font-size:13px;margin-left:6px}
.cm{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px}
.tag{font-size:12px;color:var(--ink2)}
.ctxi p{margin-top:6px;font-size:13px;color:var(--ink2)}
.sec{margin-top:26px}
.sec>.sub{margin:2px 0 10px}
.term{background:none;border:0;padding:0;font:inherit;color:inherit;border-bottom:1px dotted var(--ink2);cursor:help;text-align:left}
details.g{padding:0 14px}
details.g+details.g{border-top:1px solid var(--grid)}
details.g summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
details.g p{font-size:14px;color:var(--ink2);padding-bottom:12px}
.foot{margin-top:26px;font-size:12px;color:var(--ink2)}
.foot p+p{margin-top:6px}

.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;background:rgba(0,0,0,.45)}
.sheet[hidden]{display:none}
.sheet .panel{background:var(--surface);width:100%;max-width:720px;margin:0 auto;border-radius:16px 16px 0 0;max-height:70vh;overflow:auto;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet p{color:var(--ink2);margin-bottom:14px}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
@media (max-width:380px){.big{font-size:48px}.row{grid-template-columns:minmax(0,1fr) 64px auto}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <h3 id="sh-t"></h3>
    <p id="sh-d"></p>
    <button class="chip" id="sh-x" data-act="close"></button>
  </div>
</div>

var END=new Date(Date.UTC(2026,10,18));

function gauss(r){var u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function bizDates(){var out=[],d=new Date(END);while(out.length<N){var w=d.getUTCDay();if(w!==0&&w!==6)out.push(new Date(d));d.setUTCDate(d.getUTCDate()-1)}return out.reverse()}
var DATES=bizDates();

function series(c){var r=mulberry32(c.seed),v=[1];for(var i=1;i<N;i++){var dr=c.drift+(i>=N-25?c.late:0);v.push(v[i-1]*Math.exp(dr+c.vol*gauss(r)))}var k=c.price/v[N-1];return v.map(function(x){return x*k})}
function sma(a,n,i){if(i<n-1)return null;var s=0;for(var j=i-n+1;j<=i;j++)s+=a[j];return s/n}
function rsi(a,n){var g=0,l=0,i,d;for(i=1;i<=n;i++){d=a[i]-a[i-1];if(d>=0)g+=d;else l-=d}g/=n;l/=n;for(i=n+1;i<a.length;i++){d=a[i]-a[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n}return l===0?100:100-100/(1+g/l)}
function analyze(a,y0){
 var L=a.length-1,px=a[L],ma=sma(a,20,L);
 var ch=function(k){return(px/a[L-k]-1)*100};
 var rets=[],i;for(i=L-19;i<=L;i++)rets.push(Math.log(a[i]/a[i-1]));
 var mean=rets.reduce(function(x,y){return x+y},0)/rets.length;

 var r=rsi(a,14),gap=(px/ma-1)*100,c5=ch(5),z=c5/100/(sd*Math.sqrt(5));
 var trend=gap>0.5?1:gap<-0.5?-1:0,mom=r>55?1:r<45?-1:0,spd=z>1?1:z<-1?-1:0,score=trend+mom+spd;

}
function demoData(){return COMMS.map(function(c){var s=series(c);var o=Object.assign({},c);o.s=s;o.dates=DATES;o.n=N;o.y0=YTD0;o.a=analyze(s,YTD0);return o})}

var LOC={fr:'fr-FR',en:'en-US',zh:'zh-CN'};

/* ---------- State ---------- */
var DATA=[],LIVE=null,STATUS='loading';
var DATA_URL='https://raw.githubusercontent.com/jchonmas-cmyk/commodity-pulse/data/data.json';
var state={lang:'fr',mode:'beginner',grp:'all',range:'3m',open:{brent:true}};
try{var sv=JSON.parse(localStorage.getItem('commodity-pulse')||'{}');if(sv.lang&&T[sv.lang])state.lang=sv.lang;if(sv.mode==='beginner'||sv.mode==='trader')state.mode=sv.mode}catch(e){}
function save(){try{localStorage.setItem('commodity-pulse',JSON.stringify({lang:state.lang,mode:state.mode}))}catch(e){}}
function tr(){return T[state.lang]}
function rangeK(c){var k=state.range==='1m'?22:state.range==='3m'?66:c.n-c.y0;return Math.max(10,Math.min(c.n,k))}

/* ---------- Formatting ---------- */
function nf(n,dec,signed){return new Intl.NumberFormat(LOC[state.lang],{minimumFractionDigits:dec,maximumFractionDigits:dec,signDisplay:signed?'always':'auto'}).format(n)}
function pct(n){return nf(n,2,true)+(state.lang==='fr'?' %':'%')}
function sgn(n){return n>0?'+'+n:n<0?'−'+Math.abs(n):'0'}
function cls(n){return n>0.005?'pos':n<-0.005?'neg':''}
function fd(d,o){o.timeZone='UTC';return new Intl.DateTimeFormat(LOC[state.lang],o).format(d)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---------- Building blocks ---------- */
function pillCls(cl,text){var ic=cl==='up'?'<path d="M5 1.5 9 8.5H1Z"/>':cl==='down'?'<path d="M5 8.5 1 1.5h8Z"/>':'<circle cx="5" cy="5" r="3.2"/>';return '<span class="pill '+cl+'"><svg viewBox="0 0 10 10" aria-hidden="true">'+ic+'</svg>'+esc(text)+'</span>'}
function pill(l){return pillCls(l,tr()[l])}
function termBtn(id,label){return '<button type="button" class="term" data-act="term" data-v="'+id+'">'+esc(label)+'</button>'}
function spark(vals,w,h){
 var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),p=5,n=vals.length;
 function X(i){return p+i*(w-2*p)/(n-1)}
 function Y(v){return p+(1-(v-mn)/((mx-mn)||1))*(h-2*p)}
 var d='';vals.forEach(function(v,i){d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)});
 var lx=X(n-1).toFixed(1),ly=Y(vals[n-1]).toFixed(1);
 return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true"><path class="sp-area" d="'+d+'L'+lx+' '+(h-p)+'L'+X(0).toFixed(1)+' '+(h-p)+'Z"/><path class="sp-line" d="'+d+'"/><circle class="sp-dot" cx="'+lx+'" cy="'+ly+'" r="4"/></svg>';
}
function sentence(a){var t=tr(),s=a.label==='up'?t.sUp:a.label==='down'?t.sDown:t.sFlat,j=state.lang==='zh'?'':' ';if(a.rsi>70)s+=j+t.hot;else if(a.rsi<30)s+=j+t.cold;return s}

function rowHtml(c){
 var t=tr(),a=c.a,open=!!state.open[c.id],K=rangeK(c);
 var sub=state.mode==='trader'?c.unit+' · '+c.tk:c.unit;
 if(c.stale)sub+=' · '+t.stale;
 var txt=state.mode==='trader'
  ?'RSI '+Math.round(a.rsi)+' · MA20 '+pct(a.gap)+' · '+t.d5+' '+pct(a.c5)
  :sentence(a);
 return '<div class="item"><button type="button" class="row" data-act="row" data-v="'+c.id+'" data-fk="row-'+c.id+'" aria-expanded="'+open+'" aria-controls="d-'+c.id+'">'
  +'<span class="c1"><span class="nm"><span class="nn">'+esc(t.names[c.id])+'<svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.5 6 8.5 10 4.5"/></svg></span><span class="unit">'+esc(sub)+'</span></span>'+pill(a.label)+'</span>'
  +'<span class="c2">'+spark(c.s.slice(-K),76,34)+'</span>'
  +'<span class="c3"><span class="px">'+nf(a.px,c.dec)+'</span><span class="chg '+cls(a.c1)+'">'+pct(a.c1)+'</span></span>'
  +'<span class="txt">'+esc(txt)+'</span></button>'
  +(open?detailHtml(c):'')+'</div>';
}
function detailHtml(c){
 var t=tr(),a=c.a;
 function st(label,val,cl){return '<div class="st"><span class="sl">'+label+'</span><span class="sv '+(cl||'')+'">'+val+'</span></div>'}
 var h='<div class="detail" id="d-'+c.id+'"><div class="stats">'
  +st(esc(t.d1),pct(a.c1),cls(a.c1))+st(esc(t.w1),pct(a.c5),cls(a.c5))+st(esc(t.m1),pct(a.c21),cls(a.c21))+st(esc(t.ytd),pct(a.ytd),cls(a.ytd));
 if(state.mode==='trader'){
  h+=st(termBtn('rsi',t.rsi),Math.round(a.rsi))+st(termBtn('ma20',t.gap),pct(a.gap),cls(a.gap))+st(termBtn('vol',t.vol),nf(a.vol,0)+(state.lang==='fr'?' %':'%'));
 }
 h+='</div>';
 if(state.mode==='trader'){
  h+='<div class="bd"><span>'+termBtn('score',t.scoreTitle)+'</span><span>'+esc(t.trend)+' '+sgn(a.trend)+'</span><span>'+esc(t.mom)+' '+sgn(a.mom)+'</span><span>'+esc(t.spd)+' '+sgn(a.spd)+'</span><b>'+esc(t.total)+' '+sgn(a.score)+'</b></div>';
 }
 h+='<p class="watch"><b>'+esc(t.watch)+'</b> · '+esc(t.watchTxt[c.id])+'</p>';
 h+='<div class="chart" data-id="'+c.id+'"></div>';
 h+='<div class="lg"><span><i class="key" style="background:var(--s1)"></i>'+esc(t.price)+'</span><span><i class="key" style="background:var(--s2)"></i>'+termBtn('ma20',t.ma)+'</span></div>';
 var rows='';for(var k=0;k<8&&k<c.n;k++){var i=c.n-1-k;rows+='<tr><td>'+fd(c.dates[i],{day:'numeric',month:'short'})+'</td><td>'+nf(c.s[i],c.dec)+'</td><td>'+nf(sma(c.s,20,i),c.dec)+'</td></tr>'}
 h+='<details class="tb"><summary>'+esc(t.table)+'</summary><div class="tbw"><table><thead><tr><th>'+esc(t.date)+'</th><th>'+esc(t.close)+'</th><th>'+esc(t.avg)+'</th></tr></thead><tbody>'+rows+'</tbody></table></div></details>';
 return h+'</div>';
}
function ctxHtml(x){
 var t=tr(),nm=t.ctxN[x.id],d=x.d,imp=impact(x.id,d),v,chg='';
 if(x.kind==='eia')v=nf(d.chg,1,true)+' '+t.eiaUnit;
 else if(x.kind==='cot')v=t.cotVal(Math.round(d.v));
 else v=nf(d.v,x.dec)+(x.id==='real'?(state.lang==='fr'?'\u202f%':'%'):'');
 if(x.kind==='pct'&&d.chg!=null)chg='<small class="'+cls(d.chg)+'">'+pct(d.chg)+'</small>';
 if(x.kind==='pt'&&d.chg!=null)chg='<small class="'+cls(d.chg)+'">'+nf(d.chg,2,true)+' pt</small>';
 var ic=imp==='sup'?'up':imp==='weigh'?'down':'flat';
 var name=nm[1]?termBtn(nm[1],nm[0]):esc(nm[0]);
 return '<div class="ctxi"><div class="ch"><span class="cn">'+name+'</span><span class="cv">'+esc(v)+chg+'</span></div>'
  +'<div class="cm">'+pillCls(ic,t[imp])+'<span class="tag">'+esc(t[x.freq])+(state.mode==='trader'?' · '+esc(x.src):'')+'</span></div>'
  +'<p>'+esc(t.ctxT[x.id][imp])+'</p></div>';
}
function subLine(){
 var t=tr();
 if(STATUS==='live'&&LIVE)return t.upd+' '+new Intl.DateTimeFormat(LOC[state.lang],{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(LIVE.updated));
 if(STATUS==='loading')return t.load;
 return t.asof+' '+fd(END,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function noteHtml(){
 var t=tr();
 if(STATUS==='demo')return '<div class="note"><b>'+esc(t.demo)+'.</b> '+esc(t.demoNote)+'</div>';
 if(STATUS==='live'&&LIVE&&Date.now()-new Date(LIVE.updated).getTime()>36*3600e3)return '<div class="note">'+esc(t.old)+'</div>';
 return '';
}

/* ---------- Render ---------- */
function render(){
 var t=tr();
 var ae=document.activeElement,fk=ae&&ae.dataset?ae.dataset.fk:null;
 document.documentElement.lang=state.lang==='zh'?'zh-Hans':state.lang;
 var cUp=0,cFl=0,cDn=0,above=0;
 DATA.forEach(function(c){var l=c.a.label;if(l==='up')cUp++;else if(l==='down')cDn++;else cFl++;if(c.a.px>c.a.ma)above++});
 function bar(n,col){return n?'<i style="flex:'+n+';background:'+col+'"></i>':''}
 function leg(n,col,l){return '<span><i class="sw" style="background:'+col+'"></i>'+esc(t[l])+' '+n+'</span>'}
 var h='';
 h+='<div class="top"><div><h1>Commodity Pulse</h1><p class="sub">'+esc(subLine())+'</p></div>'
  +'<div class="ctrls"><div class="seg" role="group" aria-label="Language">'
  +['fr','en','zh'].map(function(l){return '<button type="button" data-act="lang" data-v="'+l+'" data-fk="lang-'+l+'" aria-pressed="'+(state.lang===l)+'">'+(l==='zh'?'中文':l.toUpperCase())+'</button>'}).join('')
  +'</div><div class="seg" role="group" aria-label="'+esc(t.mode)+'">'
  +['beginner','trader'].map(function(m){return '<button type="button" data-act="mode" data-v="'+m+'" data-fk="mode-'+m+'" aria-pressed="'+(state.mode===m)+'">'+esc(t[m])+'</button>'}).join('')
  +'</div></div></div>';
 if(STATUS==='loading'){document.getElementById('app').innerHTML=h;document.getElementById('sh-x').textContent=t.close_;return}
 h+=noteHtml();
 h+='<section class="hero" aria-label="Market summary"><div class="big">'+above+' <small>/ '+DATA.length+'</small></div>'
  +'<p class="lead">'+esc(t.heroLead)+'</p><p class="help">'+esc(t.heroHelp)+'</p>'
  +'<div class="segbar" role="img" aria-label="'+esc(t.up+' '+cUp+', '+t.flat+' '+cFl+', '+t.down+' '+cDn)+'">'+bar(cUp,'var(--up)')+bar(cFl,'var(--flat)')+bar(cDn,'var(--down)')+'</div>'
  +'<div class="legend">'+leg(cUp,'var(--up)','up')+leg(cFl,'var(--flat)','flat')+leg(cDn,'var(--down)','down')+'</div></section>';
 h+='<div class="filters"><div class="fg" role="group" aria-label="Filter">'
  +['all'].concat(GROUPS).map(function(g){return '<button type="button" class="chip" data-act="grp" data-v="'+g+'" data-fk="g-'+g+'" aria-pressed="'+(state.grp===g)+'">'+esc(t[g])+'</button>'}).join('')
  +'</div><div class="fg" role="group" aria-label="Range">'
  +['1m','3m','ytd'].map(function(r){return '<button type="button" class="chip" data-act="range" data-v="'+r+'" data-fk="r-'+r+'" aria-pressed="'+(state.range===r)+'">'+esc(t['r'+r])+'</button>'}).join('')
  +'</div></div>';
 GROUPS.forEach(function(g){
  if(state.grp!=='all'&&state.grp!==g)return;
  var items=DATA.filter(function(c){return c.grp===g});
  h+='<section class="grp"><h2>'+esc(t[g])+'<span>'+items.length+'</span></h2><div class="list">'+items.map(rowHtml).join('')+'</div></section>';
 });
 h+='<section class="sec"><h2>'+esc(t.ctx)+'</h2><p class="sub">'+esc(t.ctxSub)+'</p><div class="list">'+ctxItems().map(ctxHtml).join('')+'</div></section>';
 h+='<section class="sec"><h2>'+esc(t.gloss)+'</h2><p class="sub">'+esc(t.glossSub)+'</p><div class="list">'
  +GL.map(function(id){return '<details class="g"><summary>'+esc(t.g[id][0])+'</summary><p>'+esc(t.g[id][1])+'</p></details>'}).join('')+'</div></section>';
 h+='<footer class="foot"><p><b>'+esc(t.sources)+'</b> · Yahoo Finance · FRED · EIA · CFTC · USDA</p><p>'+esc(t.disc)+'</p></footer>';
 document.getElementById('app').innerHTML=h;
 document.getElementById('sh-x').textContent=t.close_;
 drawCharts();
 if(fk){var el=document.querySelector('[data-fk="'+fk+'"]');if(el)el.focus({preventScroll:true})}
}

/* ---------- Detail chart ---------- */
function niceTicks(lo,hi,n){var raw=(hi-lo)/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,step=(f<1.5?1:f<3?2:f<7?5:10)*p,out=[];for(var v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step)out.push(+v.toFixed(10));return{ticks:out,step:step}}
function drawCharts(){document.querySelectorAll('.chart[data-id]').forEach(drawChart)}
function drawChart(el){
 var t=tr(),c=DATA.filter(function(x){return x.id===el.dataset.id})[0],W=el.clientWidth;
 if(!c||W<120)return;
 var K=rangeK(c),n0=Math.max(19,c.n-K),idx=[],i;K=c.n-n0;for(i=n0;i<c.n;i++)idx.push(i);
 var px=idx.map(function(i){return c.s[i]}),ma=idx.map(function(i){return sma(c.s,20,i)});
 var H=200,m={l:48,r:10,t:10,b:24},all=px.concat(ma);
 var lo=Math.min.apply(null,all),hi=Math.max.apply(null,all),pad=(hi-lo)*.08||1;lo-=pad;hi+=pad;
 var nt=niceTicks(lo,hi,4),tdec=nt.step>=1?0:Math.min(3,Math.ceil(-Math.log10(nt.step)));
 function X(k){return m.l+k/(K-1)*(W-m.l-m.r)}
 function Y(v){return m.t+(1-(v-lo)/(hi-lo))*(H-m.t-m.b)}
 function path(a){return a.map(function(v,k){return(k?'L':'M')+X(k).toFixed(1)+' '+Y(v).toFixed(1)}).join('')}
 var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" tabindex="0" role="img" aria-label="'+esc(t.names[c.id]+' — '+t.price+', '+t.ma)+'">';
 nt.ticks.forEach(function(v){s+='<line class="gl" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text class="tk" x="'+(m.l-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+nf(v,tdec)+'</text>'});
 s+='<line class="ax" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+(H-m.b)+'" y2="'+(H-m.b)+'"/>';
 [[0,'start'],[Math.round((K-1)/2),'middle'],[K-1,'end']].forEach(function(p){s+='<text class="tk" x="'+X(p[0]).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+p[1]+'">'+fd(c.dates[idx[p[0]]],{day:'numeric',month:'short'})+'</text>'});
 s+='<path d="'+path(px)+'L'+X(K-1).toFixed(1)+' '+(H-m.b)+'L'+X(0).toFixed(1)+' '+(H-m.b)+'Z" fill="var(--s1)" opacity=".1"/>';
 s+='<path class="ln" stroke="var(--s2)" d="'+path(ma)+'"/><path class="ln" stroke="var(--s1)" d="'+path(px)+'"/>';
 s+='<circle cx="'+X(K-1).toFixed(1)+'" cy="'+Y(px[K-1]).toFixed(1)+'" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>';
 s+='<g class="hov" visibility="hidden"><line class="ax" y1="'+m.t+'" y2="'+(H-m.b)+'"/><circle class="h2" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/><circle class="h1" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/></g></svg><div class="tip" hidden></div>';
 el.innerHTML=s;
 var svg=el.querySelector('svg'),tip=el.querySelector('.tip'),hov=svg.querySelector('.hov'),cur=K-1;
 function show(k){
  k=Math.max(0,Math.min(K-1,k));cur=k;var x=X(k);
  var ln=hov.querySelector('line');ln.setAttribute('x1',x);ln.setAttribute('x2',x);
  var h1=hov.querySelector('.h1'),h2=hov.querySelector('.h2');
  h1.setAttribute('cx',x);h1.setAttribute('cy',Y(px[k]));h2.setAttribute('cx',x);h2.setAttribute('cy',Y(ma[k]));
  hov.setAttribute('visibility','visible');
  tip.hidden=false;
  tip.innerHTML='<div class="d">'+esc(fd(c.dates[idx[k]],{day:'numeric',month:'short',year:'numeric'}))+'</div>'
   +'<div class="r"><i class="key" style="background:var(--s1)"></i><b>'+nf(px[k],c.dec)+'</b><span class="n">'+esc(t.price)+'</span></div>'
   +'<div class="r"><i class="key" style="background:var(--s2)"></i><b>'+nf(ma[k],c.dec)+'</b><span class="n">'+esc(t.ma)+'</span></div>';
  var tw=tip.offsetWidth,left=x+12;if(left+tw>W-2)left=x-12-tw;tip.style.left=Math.max(2,left)+'px';
 }
 function hide(){hov.setAttribute('visibility','hidden');tip.hidden=true}
 function at(e){var r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*(W/r.width);show(Math.round((x-m.l)/(W-m.l-m.r)*(K-1)))}
 svg.addEventListener('pointermove',at);
 svg.addEventListener('pointerdown',at);
 svg.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')hide()});
 svg.addEventListener('focus',function(){show(cur)});
 svg.addEventListener('blur',hide);
 svg.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'){show(cur-1);e.preventDefault()}
  else if(e.key==='ArrowRight'){show(cur+1);e.preventDefault()}
  else if(e.key==='Home'){show(0);e.preventDefault()}
  else if(e.key==='End'){show(K-1);e.preventDefault()}
  else if(e.key==='Escape'){hide()}
 });
}

/* ---------- Glossary sheet and events ---------- */
var lastFocus=null;
function openTerm(id){var g=tr().g[id];if(!g)return;lastFocus=document.activeElement;document.getElementById('sh-t').textContent=g[0];document.getElementById('sh-d').textContent=g[1];document.getElementById('sheet').hidden=false;document.getElementById('sh-x').focus()}
function closeTerm(){document.getElementById('sheet').hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true})}
document.addEventListener('click',function(e){
 if(e.target.id==='sheet'){closeTerm();return}
 var b=e.target.closest('[data-act]');if(!b)return;
 var a=b.dataset.act,v=b.dataset.v;
 if(a==='term'){openTerm(v);return}
 if(a==='close'){closeTerm();return}
 if(a==='lang'){state.lang=v;save()}
 else if(a==='mode'){state.mode=v;save()}
 else if(a==='grp'){state.grp=v}
 else if(a==='range'){state.range=v}
 else if(a==='row'){if(state.open[v])delete state.open[v];else state.open[v]=true}
 if(!document.getElementById('sheet').hidden)document.getElementById('sheet').hidden=true;
 render();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!document.getElementById('sheet').hidden)closeTerm()});
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(drawCharts,120)});
function toItem(c,s){
 var o=Object.assign({},c);
 o.s=s.c;o.dates=s.d.map(function(x){return new Date(x+'T00:00:00Z')});o.n=s.c.length;
 var ly=o.dates[o.n-1].getUTCFullYear(),first=0;
 while(first<o.n&&o.dates[first].getUTCFullYear()<ly)first++;
 o.y0=Math.max(0,first-1);o.stale=!!s.stale;o.a=analyze(o.s,o.y0);
 return o;
}
function fetchLive(){
 return fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(j){
  if(STATUS==='live'&&LIVE&&LIVE.updated===j.updated)return false;
  var items=[];
  COMMS.forEach(function(c){var s=j.items&&j.items[c.id];if(s&&s.c&&s.d&&s.c.length>=30&&s.c.length===s.d.length)items.push(toItem(c,s))});
  if(!items.length)throw new Error('empty');
  DATA=items;LIVE=j;STATUS='live';return true;
 });
}
function refresh(first){
 return fetchLive().catch(function(){if(first){DATA=demoData();STATUS='demo';return true}return false}).then(function(changed){if(changed)render()});
}
render();
refresh(true);
setInterval(function(){if(!document.hidden)refresh(false)},300000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh(false)});
})();
</script>
